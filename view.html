<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Confidences</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&family=Caveat:wght@500;700&family=Merriweather:wght@400;700&family=Dancing+Script:wght@500;700&family=Montserrat:wght@400;600&family=Courier+Prime&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/reader.css" />
</head>
<body>
  <div id="reader-loading" class="reader">
    <div class="spinner" aria-label="Chargement"></div>
  </div>

  <div id="reader-error" class="reader" hidden>
    <div class="reader__state">
      <h1>Confidence introuvable</h1>
      <p>Ce lien n'existe pas ou n'est plus disponible.</p>
    </div>
  </div>

  <div id="reader-lock" class="reader" hidden>
    <form id="reader-lock-form" class="reader__state reader__lock" autocomplete="off">
      <svg class="reader__lock-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
        <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
      </svg>
      <h1>Confidence protégée</h1>
      <p>Saisissez le mot de passe pour la lire.</p>
      <input id="reader-lock-input" class="reader__lock-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Mot de passe" aria-label="Mot de passe" required />
      <button id="reader-lock-submit" class="reader__lock-btn" type="submit">Ouvrir</button>
      <p id="reader-lock-error" class="reader__lock-error" role="alert"></p>
    </form>
  </div>

  <div id="reader" class="reader" hidden>
    <div id="reader-frame" class="reader__frame slide">
      <div id="reader-slide-content" class="reader__content"></div>
      <div class="reader__progress" id="reader-progress"></div>
      <div class="reader__tap-zone reader__tap-zone--left" id="tap-prev"></div>
      <div class="reader__tap-zone reader__tap-zone--right" id="tap-next"></div>
      <div class="reader__hint" id="reader-hint">Touchez l'écran pour naviguer</div>
      <div class="reader__rotate" id="reader-rotate" role="status" hidden>
        <svg class="reader__rotate-icon" viewBox="0 0 64 64" aria-hidden="true">
          <g class="reader__rotate-phone">
            <rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
            <line x1="28" y1="46" x2="36" y2="46" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </g>
          <path d="M50 14 a20 20 0 0 1 6 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          <path d="M53 26 l3 3 l3 -4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="reader__rotate-label"></span>
      </div>
      <div class="reader__owner-bar" id="reader-owner-bar" hidden>
        <span class="reader__owner-badge" title="Vous êtes le créateur : vos lectures ne sont pas comptées">Créateur · non compté</span>
        <label class="reader__owner-jump">
          <span class="sr-only">Aller à la page</span>
          <select id="reader-owner-select" aria-label="Aller à la page"></select>
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="js/reader.js"></script>
</body>
</html>
